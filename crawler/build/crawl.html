<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRAWL: Dungeon Crawler Carl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600;700&family=VT323&display=swap">
<style>
/* Layout: full-bleed 3D view, HUD pinned to the four corners, menus as a centered panel over a dimmed view. */
:root {
  color-scheme: dark;
  --ink: #0b0910;          /* void behind everything */
  --panel: #16121e;        /* menu surfaces */
  --panel-2: #211a2c;
  --line: #3a3048;
  --text: #ece6f2;
  --muted: #9d93ab;
  --gold: #ffcc33;         /* show-business accent */
  --sys: #5fd8ff;          /* the System AI's voice */
  --donut: #ff7ad9;        /* Princess Donut */
  --blood: #e0303a;
  --good: #6cf09a;
  --f-display: 'Bungee', 'Impact', 'Arial Black', sans-serif;
  --f-ui: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  --f-sys: 'VT323', 'Consolas', 'Courier New', monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--text); overflow: hidden; font-family: var(--f-ui); }
#game { position: fixed; inset: 0; user-select: none; -webkit-user-select: none; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; cursor: crosshair; }

/* ------------------------------------------------------------------ HUD */
#hud { position: absolute; inset: 0; pointer-events: none; transition: opacity .2s; }
#hud.dim { opacity: .25; }
.hud-tl { position: absolute; left: 16px; top: 14px; display: grid; gap: 4px; }
#floor-name { font-family: var(--f-display); font-size: 15px; letter-spacing: .04em; color: var(--text); text-shadow: 2px 2px 0 #000; }
.hud-row { display: flex; gap: 14px; align-items: baseline; font-family: var(--f-sys); font-size: 22px; text-shadow: 1px 1px 0 #000; }
#timer { color: var(--gold); font-size: 30px; font-variant-numeric: tabular-nums; }
#timer.urgent { color: var(--blood); animation: pulse .6s infinite alternate; }
.viewers { color: var(--muted); }
.viewers b { color: var(--text); font-weight: 400; }
.live-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--blood); margin-right: 5px; animation: pulse 1s infinite alternate; vertical-align: 1px; }
#safe-badge { font-family: var(--f-display); font-size: 12px; color: var(--good); letter-spacing: .08em; }
.hud-tr { position: absolute; right: 16px; top: 14px; }
#minimap { width: 132px; height: 132px; border: 2px solid var(--line); border-radius: 50%; display: block; background: #000; }

#bossbar { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); width: min(520px, 50vw); text-align: center; }
#boss-name { font-family: var(--f-display); color: var(--blood); font-size: 15px; text-shadow: 2px 2px 0 #000; margin-bottom: 4px; }
.boss-track { height: 12px; background: #1a0808; border: 2px solid #000; box-shadow: 0 0 0 1px var(--blood); }
#boss-fill { height: 100%; width: 100%; background: linear-gradient(#ff5048, #a01418); transition: width .15s; }

.hud-bl { position: absolute; left: 16px; bottom: 16px; width: min(320px, 40vw); display: grid; gap: 6px; }
.bar { position: relative; height: 22px; background: #000a; border: 2px solid #000; box-shadow: 0 0 0 1px var(--line); }
.bar .fill { position: absolute; inset: 0; width: 100%; transition: width .12s; }
#hp-fill { background: linear-gradient(#ff5a5a, #b0161e); }
#hp-text { position: absolute; inset: 0; display: flex; align-items: center; padding-left: 8px; font-family: var(--f-sys); font-size: 21px; text-shadow: 1px 1px 0 #000; font-variant-numeric: tabular-nums; }
.bar.xp { height: 8px; }
#xp-fill { background: var(--sys); }
.lvl-row { display: flex; gap: 10px; align-items: center; font-family: var(--f-sys); font-size: 20px; text-shadow: 1px 1px 0 #000; }
.lvl-row .lv { font-family: var(--f-display); font-size: 13px; color: var(--sys); }
#points { color: var(--gold); animation: pulse .7s infinite alternate; }
.gold { color: var(--gold); }

.hud-br { position: absolute; right: 16px; bottom: 16px; text-align: right; display: grid; gap: 6px; justify-items: end; }
#weapon-name { font-family: var(--f-display); font-size: 15px; text-shadow: 2px 2px 0 #000; }
#ammo { font-family: var(--f-sys); font-size: 26px; color: var(--gold); text-shadow: 1px 1px 0 #000; }
#slots { display: flex; gap: 4px; }
.slot { width: 22px; height: 22px; display: grid; place-items: center; font-family: var(--f-sys); font-size: 18px; background: #000a; border: 1px solid var(--line); color: var(--muted); }
.slot.on { border-color: var(--gold); color: var(--gold); }
.slot.locked { opacity: .3; }
.inv-row { display: flex; gap: 12px; font-family: var(--f-sys); font-size: 20px; text-shadow: 1px 1px 0 #000; align-items: center; }
.inv-row kbd { font-family: var(--f-sys); font-size: 15px; padding: 0 4px; border: 1px solid var(--line); background: #000a; color: var(--muted); }
.cd { --p: 1; position: relative; padding: 1px 8px; border: 1px solid var(--line); background: linear-gradient(90deg, #ffffff22 calc(var(--p) * 100%), #0008 0); color: var(--muted); }
.cd.ready { color: var(--text); border-color: var(--muted); }
#ult-cd.ready { color: var(--donut); border-color: var(--donut); }

#crosshair { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; transform: translate(-50%, -50%); }
#crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fffc; box-shadow: 0 0 0 1px #0008; }
#crosshair::before { left: 6px; top: 0; width: 2px; height: 14px; }
#crosshair::after { top: 6px; left: 0; height: 2px; width: 14px; }
#prompt { position: absolute; left: 50%; top: calc(50% + 34px); transform: translateX(-50%); font-family: var(--f-sys); font-size: 24px; background: #000b; padding: 2px 12px; border: 1px solid var(--line); white-space: nowrap; }
#prompt b { color: var(--gold); font-weight: 400; border: 1px solid var(--gold); padding: 0 5px; margin-right: 6px; }

#log { position: absolute; left: 16px; top: 96px; width: min(380px, 38vw); display: grid; gap: 5px; }
.msg { font-family: var(--f-sys); font-size: 17px; line-height: 1.05; padding: 5px 9px; background: #06101acc; border-left: 3px solid var(--sys); color: #d8f4ff; animation: slidein .25s ease-out; transition: opacity 1.4s; }
.msg .who { color: var(--sys); margin-right: 4px; }
.msg.donut { border-color: var(--donut); background: #1a0816cc; color: #ffe0f6; }
.msg.donut .who { color: var(--donut); }
.msg.boss { border-color: var(--blood); background: #1a0606cc; color: #ffd8d8; }
.msg.boss .who { color: var(--blood); }
.msg.warn { border-color: var(--gold); }
.msg.warn .who { color: var(--gold); }
.msg.good { border-color: var(--good); }
.msg.good .who { color: var(--good); }
.msg.fade { opacity: 0; }

#achv { position: absolute; top: 60px; left: 50%; transform: translate(-50%, -30px); width: min(520px, 80vw); padding: 12px 18px 14px; background: linear-gradient(#0d2230f2, #081620f2); border: 2px solid var(--sys); box-shadow: 0 0 0 4px #000, 0 0 30px #5fd8ff55; text-align: center; opacity: 0; transition: opacity .3s, transform .3s; }
#achv.show { opacity: 1; transform: translate(-50%, 0); }
.achv-kicker { font-family: var(--f-sys); font-size: 18px; color: var(--sys); letter-spacing: .15em; text-transform: uppercase; }
.achv-title { font-family: var(--f-display); font-size: 21px; color: var(--gold); margin: 2px 0 6px; text-wrap: balance; }
.achv-text { font-family: var(--f-sys); font-size: 20px; line-height: 1.05; color: #d8f4ff; }
.achv-reward { font-family: var(--f-display); font-size: 12px; margin-top: 8px; }

#levelup { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-family: var(--f-display); font-size: 54px; color: var(--sys); text-shadow: 4px 4px 0 #000, 0 0 30px var(--sys); opacity: 0; pointer-events: none; }
#levelup.show { animation: lvl 2.2s ease-out forwards; }
#hurt { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 45%, #c00000cc 100%); opacity: 0; pointer-events: none; }
#click-hint { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); font-family: var(--f-display); font-size: 16px; padding: 10px 18px; background: #000c; border: 2px solid var(--gold); color: var(--gold); cursor: pointer; pointer-events: auto; }

/* --------------------------------------------------------------- screens */
.screen { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px 16px; background: #0b0910b8; overflow-y: auto; backdrop-filter: blur(2px); }
.screen.title { background: linear-gradient(180deg, #0b0910cc, #0b091066 40%, #0b0910ee); }
.panel { width: min(640px, 100%); background: var(--panel); border: 2px solid var(--line); box-shadow: 0 0 0 4px #000, 0 20px 60px #000c; padding: 26px 28px; display: grid; gap: 14px; }
.panel h2 { font-family: var(--f-display); font-size: 28px; margin: 0; color: var(--gold); text-wrap: balance; line-height: 1.1; }
.panel h3 { font-family: var(--f-display); font-size: 13px; letter-spacing: .06em; color: var(--sys); margin: 4px 0 6px; }
.sub, .hint { color: var(--muted); margin: 0; }
.hint { font-size: 13px; text-align: center; }
.menu { display: grid; gap: 10px; }
.btn { font: 600 16px var(--f-ui); color: var(--text); background: var(--panel-2); border: 2px solid var(--line); padding: 10px 18px; cursor: pointer; letter-spacing: .02em; transition: transform .08s, border-color .15s, background .15s; }
.btn:hover:not(:disabled) { border-color: var(--gold); transform: translateY(-1px); }
.btn:focus-visible { outline: 2px solid var(--sys); outline-offset: 2px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--gold); color: #1a1000; border-color: #000; box-shadow: 0 4px 0 #8a6a00; }
.btn.primary:hover { border-color: #000; }
.btn.danger { color: #ffb0b0; }
.btn.big { font-size: 19px; padding: 14px 20px; }
.btn.tiny { padding: 2px 10px; font-size: 18px; line-height: 1; }

.title-wrap { width: min(620px, 100%); text-align: center; display: grid; gap: 18px; justify-items: center; }
.title-kicker { font-family: var(--f-sys); font-size: 22px; color: var(--sys); letter-spacing: .2em; text-transform: uppercase; }
.title-logo { font-family: var(--f-display); font-size: clamp(64px, 14vw, 132px); line-height: .85; margin: 0; color: var(--gold); text-shadow: 6px 6px 0 #000, 0 0 60px #ffcc3355; display: grid; }
.title-logo span { font-size: clamp(16px, 3.2vw, 26px); color: var(--text); letter-spacing: .12em; text-shadow: 3px 3px 0 #000; margin-top: 10px; }
.title-blurb { font-size: 17px; line-height: 1.5; max-width: 52ch; margin: 0; color: var(--text); text-shadow: 1px 1px 2px #000; }
.title-wrap .menu { width: min(320px, 100%); }
.pc-note { color: var(--muted); font-size: 13px; margin: 0; }

.intro { text-align: center; }
.intro-floor { font-family: var(--f-sys); font-size: 22px; letter-spacing: .2em; color: var(--sys); text-transform: uppercase; }
.intro-name { font-size: 34px !important; }
.intro-text { font-family: var(--f-sys); font-size: 22px; line-height: 1.1; color: #d8f4ff; margin: 0; background: #06101a; border-left: 3px solid var(--sys); padding: 10px 14px; text-align: left; }
.intro-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; text-align: left; }
.intro-facts div { background: var(--panel-2); padding: 8px 12px; display: grid; gap: 2px; min-width: 0; }
.intro-facts span, .derived span, .inv span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.intro-facts b { font-weight: 600; }

.help-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 6px 16px; font-size: 14px; }
kbd { font-family: var(--f-sys); font-size: 17px; background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 3px; padding: 0 6px; color: var(--gold); }
.help ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; line-height: 1.45; font-size: 14px; }

.settings label { display: flex; justify-content: space-between; font-weight: 600; }
.settings output { color: var(--gold); font-family: var(--f-sys); font-size: 20px; }
.settings input[type=range] { width: 100%; accent-color: var(--gold); }
.settings .check { justify-content: flex-start; gap: 10px; }
.settings select { font: 600 15px var(--f-ui); color: var(--text); background: var(--panel-2); border: 2px solid var(--line); padding: 8px 10px; }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 48%, transparent 55%, #00000099 100%); }

.panel.sheet, .panel.shop { width: min(1040px, 100%); }
.sheet-head, .shop-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.sheet-points { font-family: var(--f-display); font-size: 13px; color: var(--muted); }
.sheet-points.has { color: var(--gold); animation: pulse .7s infinite alternate; }
.sheet-grid, .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.sheet-grid section, .shop-grid section { min-width: 0; }
.stat { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.stat-name { font-weight: 700; display: grid; }
.stat-name small { font-weight: 400; color: var(--muted); font-size: 12px; }
.stat-val { font-family: var(--f-display); font-size: 20px; color: var(--gold); min-width: 2ch; text-align: right; font-variant-numeric: tabular-nums; }
.derived, .inv { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin-top: 12px; }
.derived div, .inv div { display: grid; }
.derived b, .inv b { font-variant-numeric: tabular-nums; }
.weapons { width: 100%; border-collapse: collapse; font-size: 14px; }
.weapons th { text-align: left; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; padding: 4px 6px 4px 0; }
.weapons td { padding: 5px 6px 5px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.weapons tr.locked td { color: var(--muted); opacity: .6; }
.ach-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; color: var(--muted); max-height: 360px; overflow-y: auto; }
.ach-list li.got { color: var(--gold); }

.mordecai-say { font-family: var(--f-sys); font-size: 21px; line-height: 1.1; color: #d8f4ff; flex: 1; min-width: 0; }
.mordecai-say b { color: var(--good); font-weight: 400; }
.wallet { font-family: var(--f-display); font-size: 26px; color: var(--gold); display: grid; text-align: right; }
.wallet small { font-family: var(--f-ui); font-size: 11px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.shop-row, .box-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.box-row { grid-template-columns: auto 1fr auto; }
.box-icon { width: 26px; height: 26px; background: var(--c); border: 2px solid #fff; box-shadow: 0 0 12px var(--c); }
.shop-info { min-width: 0; }
.shop-name { font-weight: 700; }
.shop-desc { font-size: 13px; color: var(--muted); }
.btn.buy { min-width: 84px; padding: 6px 12px; font-size: 15px; }
.empty { color: var(--muted); font-size: 14px; }
.opened { border: 2px solid var(--c); background: #0008; padding: 10px 14px; margin-bottom: 8px; }
.opened.fresh { animation: pop .4s ease-out; }
.opened-title { font-family: var(--f-display); font-size: 13px; color: var(--c); }
.opened ul { margin: 6px 0 0; padding-left: 18px; font-family: var(--f-sys); font-size: 20px; line-height: 1.1; }

.mapview { width: min(640px, 100%); justify-items: center; }
#bigmap { width: min(560px, 100%); aspect-ratio: 1; max-width: 100%; image-rendering: pixelated; border: 2px solid var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; }

.death { text-align: center; border-color: var(--blood); }
.death h2 { color: var(--blood); font-size: 48px; }
.death-kicker { font-family: var(--f-sys); font-size: 22px; letter-spacing: .2em; color: var(--blood); text-transform: uppercase; }
.death-msg { font-family: var(--f-sys); font-size: 22px; line-height: 1.1; color: #ffd8d8; margin: 0; }
.victory { border-color: var(--gold); box-shadow: 0 0 0 4px #000, 0 0 80px #ffcc3355; }

@keyframes pulse { from { opacity: 1; } to { opacity: .45; } }
@keyframes slidein { from { transform: translateX(-12px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes lvl { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 70% { opacity: 1; transform: translate(-50%, -60%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -70%) scale(1); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
@media (max-width: 700px) {
  #log { top: auto; bottom: 150px; width: calc(100vw - 32px); }
  .hud-tr { display: none; }
  #levelup { font-size: 36px; }
}
</style>
</head>
<body>


<div id="game">
  <canvas id="view"></canvas>
  <div id="vignette"></div>
  <div id="hud" hidden>
    <div id="hurt"></div>
    <div class="hud-tl">
      <div id="floor-name">Floor 1</div>
      <div class="hud-row"><span id="timer">12:00</span><span class="viewers"><span class="live-dot"></span><b id="viewers">0</b> watching</span></div>
      <div id="safe-badge" hidden>SAFE ROOM · HEALING</div>
    </div>
    <div class="hud-tr"><canvas id="minimap" width="132" height="132"></canvas></div>
    <div id="bossbar" hidden><div id="boss-name">Boss</div><div class="boss-track"><div id="boss-fill"></div></div></div>
    <div id="log" aria-live="polite"></div>
    <div id="crosshair"></div>
    <div id="prompt" hidden></div>
    <div id="achv"></div>
    <div id="levelup"></div>
    <div class="hud-bl">
      <div class="lvl-row"><span class="lv">LV <span id="lvl">1</span></span><span class="gold"><span id="gold">0</span>g</span><span id="points" hidden></span></div>
      <div class="bar"><div class="fill" id="hp-fill"></div><div id="hp-text">100 / 100</div></div>
      <div class="bar xp"><div class="fill" id="xp-fill"></div></div>
    </div>
    <div class="hud-br">
      <div id="slots"></div>
      <div id="weapon-name">Fists</div>
      <div id="ammo">∞</div>
      <div class="inv-row">
        <span><kbd>Q</kbd> <span id="potions">0</span> potions</span>
        <span><span id="boxes">0</span> boxes</span>
      </div>
      <div class="inv-row">
        <span class="cd" id="kick-cd">F / RMB Kick</span>
        <span class="cd" id="ult-cd">R Donut</span>
      </div>
    </div>
    <div id="click-hint" hidden>Click to fight</div>
  </div>
  <div id="screen" class="screen" hidden></div>
</div>

<script>
'use strict';
// ---------------------------------------------------------------------------
// Static game data: floors, monsters, weapons, loot, achievements, dialogue.
// ---------------------------------------------------------------------------

const FLOORS = [
  {
    name: 'The Stone Maze', theme: 'stone', time: 720,
    pool: ['rat', 'rat', 'goblin'], count: 26, boss: 'ratking',
    fog: [6, 5, 8], amb: [0.2, 0.19, 0.24],
    intro: 'Welcome to Floor One. It is made of rocks and regret. Find the stairwell before the floor collapses. There is a boss. There is always a boss.',
  },
  {
    name: 'The Goblin Warrens', theme: 'moss', time: 720,
    pool: ['rat', 'goblin', 'goblin', 'slinger'], count: 32, boss: 'matriarch',
    fog: [4, 9, 5], amb: [0.16, 0.22, 0.15],
    intro: 'Floor Two. The goblins here have formed a union. Their demands are your organs.',
  },
  {
    name: 'The Ossuary', theme: 'bone', time: 660,
    pool: ['goblin', 'slinger', 'skeleton', 'skeleton'], count: 36, boss: 'bonewright',
    fog: [8, 8, 12], amb: [0.17, 0.19, 0.27],
    intro: 'Floor Three. Everything down here used to be a crawler. Try not to join the decor.',
  },
  {
    name: 'The Furnace', theme: 'furnace', time: 660,
    pool: ['skeleton', 'slinger', 'brute', 'wisp', 'wisp'], count: 40, boss: 'hellhound',
    fog: [22, 5, 2], amb: [0.3, 0.13, 0.08],
    intro: 'Floor Four. It is hot. The sponsors requested it be hotter. It has been made hotter.',
  },
  {
    name: 'The Studio', theme: 'studio', time: 600,
    pool: ['brute', 'wisp', 'skeleton', 'goblin', 'slinger'], count: 44, boss: 'showrunner',
    fog: [10, 3, 16], amb: [0.22, 0.14, 0.28],
    intro: 'Floor Five. You have reached the production floor. The Showrunner would like a word. Several, actually. All of them violent.',
  },
];

// hp/dmg are floor-one values; they scale with depth.
const MOBS = {
  rat: {
    name: 'Dungeon Rat', hp: 11, speed: 2.7, dmg: 4, range: 0.75, cd: 0.8,
    xp: 6, gold: [0, 2], h: 0.42, radius: 0.22, sprite: 'rat',
  },
  goblin: {
    name: 'Goblin Scrapper', hp: 24, speed: 2.05, dmg: 7, range: 0.9, cd: 1.0,
    xp: 12, gold: [1, 5], h: 0.72, radius: 0.28, sprite: 'goblin',

<script>
'use strict';
// ---------------------------------------------------------------------------
// Procedural art: wall/floor textures and billboard sprites are painted onto
// small offscreen canvases at startup, then converted to Uint32 pixel arrays
// that the raycaster samples directly. No image files needed.
// ---------------------------------------------------------------------------

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

// All art is authored in "logical" pixels and painted at ART_SCALE times that
// resolution, so textures come out 128x128 and sprites get smooth, detailed edges.
const ART_SCALE = 2;
function cv(w, h) {
  const c = document.createElement('canvas');
  c.width = w * ART_SCALE; c.height = h * ART_SCALE;
  c.getContext('2d').setTransform(ART_SCALE, 0, 0, ART_SCALE, 0, 0);
  return c;
}

// Fake relief: light every texel from the top-left using its brightness as a
// height map, so mortar lines, cracks and bricks read as carved surfaces.
function relief(c, strength = 1.6) {
  const x = c.getContext('2d'), w = c.width, h = c.height;
  const id = x.getImageData(0, 0, w, h), d = id.data;
  const L = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) L[i] = d[i * 4] * 0.3 + d[i * 4 + 1] * 0.55 + d[i * 4 + 2] * 0.15;
  const out = new Uint8ClampedArray(d);
  for (let y = 0; y < h; y++) for (let xx = 0; xx < w; xx++) {
    const a = L[((y + h - 1) % h) * w + (xx + w - 1) % w], b = L[((y + 1) % h) * w + (xx + 1) % w];
    const k = (a - b) * strength;
    const i = (y * w + xx) * 4;
    out[i] = d[i] - k; out[i + 1] = d[i + 1] - k; out[i + 2] = d[i + 2] - k;
  }
  id.data.set(out); x.putImageData(id, 0, 0);
  return c;
}

// Give a sprite definition: a dark outline, darkened inner edges, and soft
// top-down shading so characters stop looking like flat cut-outs.
function enhanceSprite(c) {
  const x = c.getContext('2d'), w = c.width, h = c.height;
  const id = x.getImageData(0, 0, w, h), d = id.data;
  const solid = i => d[i * 4 + 3] >= 110;
  const out = new Uint8ClampedArray(d);
  for (let y = 0; y < h; y++) for (let xx = 0; xx < w; xx++) {
    const i = y * w + xx, o = i * 4;
    const n = (xx > 0 && solid(i - 1) ? 1 : 0) + (xx < w - 1 && solid(i + 1) ? 1 : 0) + (y > 0 && solid(i - w) ? 1 : 0) + (y < h - 1 && solid(i + w) ? 1 : 0);
    if (!solid(i)) {
      if (n) { out[o] = 12; out[o + 1] = 8; out[o + 2] = 14; out[o + 3] = 255; }
      continue;
    }
    const edge = n < 4 ? 0.72 : 1;
    const shade = (1.12 - 0.34 * y / h) * edge;
    // a little rim light where the sprite's top edge meets air
    const rim = y > 1 && !solid(i - w * 2) ? 28 : 0;
    out[o] = d[o] * shade + rim; out[o + 1] = d[o + 1] * shade + rim; out[o + 2] = d[o + 2] * shade + rim;
  }
  id.data.set(out); x.putImageData(id, 0, 0);
  return c;
}

// Convert a canvas into {w,h,data} with ABGR pixels. Transparent pixels = 0.
function toTex(c) {
  const w = c.width, h = c.height;
  const d = c.getContext('2d').getImageData(0, 0, w, h).data;
  const out = new Uint32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    const a = d[i * 4 + 3];
    if (a < 110) { out[i] = 0; continue; }
    out[i] = (255 << 24 | d[i * 4 + 2] << 16 | d[i * 4 + 1] << 8 | d[i * 4]) >>> 0;
  }
  return { w, h, data: out };
}

const rgb = (r, g, b) => `rgb(${r | 0},${g | 0},${b | 0})`;
function jit(rng, c, amt) { const k = (rng() - 0.5) * amt; return c.map(v => clamp(v + k + (rng() - 0.5) * amt * 0.3, 0, 255)); }

function noisePass(c, rng, amt, speck = 0) {
  const x = c.getContext('2d');
  const id = x.getImageData(0, 0, c.width, c.height), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] === 0) continue;
    let n = (rng() - 0.5) * amt;
    if (speck && rng() < speck) n -= 40;
    d[i] = clamp(d[i] + n, 0, 255); d[i + 1] = clamp(d[i + 1] + n, 0, 255); d[i + 2] = clamp(d[i + 2] + n, 0, 255);
  }
  x.putImageData(id, 0, 0);
}

// ---------- drawing shorthands ----------
function P(ctx) {
  return {
    ctx,
    fill(c) { ctx.fillStyle = c; return this; },
    stroke(c, w = 1) { ctx.strokeStyle = c; ctx.lineWidth = w; return this; },
    rect(x, y, w, h, c) { if (c) ctx.fillStyle = c; ctx.fillRect(x, y, w, h); return this; },
    circ(x, y, r, c) { if (c) ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); return this; },
    ell(x, y, rx, ry, c, rot = 0) { if (c) ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fill(); return this; },
    poly(pts, c) { if (c) ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); ctx.fill(); return this; },
    line(x1, y1, x2, y2, c, w = 1) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); return this; },
    text(t, x, y, c, font) { ctx.fillStyle = c; ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t, x, y); return this; },
  };
}

// =========================== WALL TEXTURES ===============================

function brickTex(seed, o) {
  const rng = mulberry32(seed), c = cv(64, 64), p = P(c.getContext('2d'));
  p.rect(0, 0, 64, 64, rgb(...o.mortar));
  const rows = o.rows || 8, cols = o.cols || 4, bh = 64 / rows, bw = 64 / cols;
  for (let r = 0; r < rows; r++) {
    const off = (r % 2) * bw / 2 + (o.stagger ? rng() * 6 : 0);
    for (let i = -1; i <= cols; i++) {
      const bx = i * bw + off, by = r * bh;
      const col = jit(rng, o.base, o.jitter || 30);
      p.rect(bx + 1, by + 1, bw - 2, bh - 2, rgb(...col));
      p.rect(bx + 1, by + 1, bw - 2, 1, rgb(...col.map(v => v + 22)));
      p.rect(bx + 1, by + bh - 2, bw - 2, 1, rgb(...col.map(v => v - 30)));
      if (o.cracks && rng() < o.cracks) {
        const cx = bx + 2 + rng() * (bw - 4), cy = by + 2;
        p.line(cx, cy, cx + (rng() - 0.5) * 6, cy + bh - 4, rgb(...col.map(v => v - 45)), 1);
      }
    }
  }
  noisePass(c, rng, o.noise || 18, o.speck || 0.02);
  return c;
}

function stoneWall(seed, base) {
  return brickTex(seed, { base, mortar: base.map(v => v * 0.45), rows: 5, cols: 3, jitter: 34, stagger: true, cracks: 0.25, noise: 22, speck: 0.04 });
}

function mossify(c, seed, amount) {
  const rng = mulberry32(seed), p = P(c.getContext('2d'));
  for (let i = 0; i < amount; i++) {
    const x = rng() * 64, y = rng() < 0.6 ? 48 + rng() * 16 : rng() * 64;
    p.ell(x, y, 2 + rng() * 5, 1 + rng() * 3, rgb(40 + rng() * 30, 90 + rng() * 50, 30 + rng() * 20));
  }
  for (let i = 0; i < 6; i++) { // hanging vines
    const x = rng() * 64; let y = 0;
    const len = 10 + rng() * 30;
    p.line(x, 0, x + (rng() - 0.5) * 4, len, rgb(50, 110 + rng() * 40, 40), 1.5);
    y = len; p.circ(x, y, 1.5, rgb(70, 150, 50));
  }
  noisePass(c, rng, 10);
  return c;
}

function boneWall(seed) {
  const rng = mulberry32(seed), c = cv(64, 64), p = P(c.getContext('2d'));
  p.rect(0, 0, 64, 64, '#2a2622');
  for (let i = 0; i < 60; i++) { // packed bones
    const x = rng() * 64, y = rng() * 64, a = rng() * Math.PI, l = 6 + rng() * 10;
    const dx = Math.cos(a) * l / 2, dy = Math.sin(a) * l / 2, col = rgb(105 + rng() * 50, 98 + rng() * 45, 78 + rng() * 32);

    p.circ(x - 3, y - 1, 2.5, '#1a1612').circ(x + 3, y - 1, 2.5, '#1a1612');
    p.poly([x, y + 2, x - 1.5, y + 5, x + 1.5, y + 5], '#1a1612');
    for (let t = -4; t <= 4; t += 2) p.rect(x + t - 0.5, y + 6, 1, 3, '#3a342c');
  }
  noisePass(c, rng, 16, 0.03);
  return c;
}

function furnaceWall(seed, alt) {
  const c = brickTex(seed, { base: [92, 38, 30], mortar: [30, 10, 8], rows: 8, cols: 4, jitter: 26, cracks: 0.35, noise: 16 });
  const rng = mulberry32(seed + 9), p = P(c.getContext('2d'));
  for (let i = 0; i < (alt ? 9 : 4); i++) { // glowing cracks
    let x = rng() * 64, y = rng() * 64;
    for (let s = 0; s < 6; s++) {
      const nx = x + (rng() - 0.5) * 10, ny = y + rng() * 8;
      p.line(x, y, nx, ny, 'rgba(255,140,30,0.9)', 1.5);
      p.line(x, y, nx, ny, 'rgba(255,230,120,0.9)', 0.6);

    for (let i = 0; i < 36; i++) p.rect(15 + i, 30 + Math.sin(i * 0.7) * 3 + rng() * 6, 1, 20, rgb(255, 80 + rng() * 120, 20));

    p.rect(14, 22, 36, 3, '#2e2a28').rect(14, 47, 36, 3, '#2e2a28');
  }
  return c;
}

function studioWall(seed, alt) {
  const rng = mulberry32(seed), c = cv(64, 64), p = P(c.getContext('2d'));
  p.rect(0, 0, 64, 64, '#1c1428');
  for (let y = 0; y < 64; y += 32) for (let x = 0; x < 64; x += 32) {
    p.rect(x + 1, y + 1, 30, 30, '#2a1f3c').rect(x + 1, y + 1, 30, 1, '#3d2e56').rect(x + 1, y + 30, 30, 1, '#120c1a');
    p.circ(x + 4, y + 4, 1, '#6a5a80').circ(x + 28, y + 4, 1, '#6a5a80').circ(x + 4, y + 28, 1, '#6a5a80').circ(x + 28, y + 28, 1, '#6a5a80');
  }
  p.rect(0, 40, 64, 3, '#ff2fb0').rect(0, 41, 64, 1, '#ffc0ec');
  p.rect(0, 12, 64, 2, '#36e0ff');
  if (alt) {
    p.rect(8, 16, 48, 20, '#140a0a').rect(10, 18, 44, 16, '#b0101a');
    p.text('ON AIR', 32, 26.5, '#ffe0e0', 'bold 11px monospace');
  }
  noisePass(c, rng, 8);
  return c;
}

function woodWall(seed) {
  const rng = mulberry32(seed), c = cv(64, 64), p = P(c.getContext('2d'));
  for (let i = 0; i < 8; i++) {
    const col = jit(rng, [110, 70, 40], 25);
    p.rect(0, i * 8, 64, 8, rgb(...col)).rect(0, i * 8 + 7, 64, 1, rgb(...col.map(v => v * 0.5)));
    for (let k = 0; k < 4; k++) p.line(rng() * 64, i * 8 + 2 + rng() * 4, rng() * 64, i * 8 + 2 + rng() * 4, rgb(...col.map(v => v * 0.8)), 0.6);
  }
  p.rect(0, 50, 64, 4, '#2e6b3a').rect(0, 51, 64, 1, '#7fe08f'); // safe-room green trim
  p.rect(0, 10, 64, 2, '#3a2412');
  noisePass(c, rng, 10);
  return c;
}

function doorTex(seed, boss, themeCol) {
  const rng = mulberry32(seed), c = cv(64, 64), p = P(c.getContext('2d'));
  const base = boss ? [120, 25, 20] : [105, 68, 38];
  for (let i = 0; i < 6; i++) {
    const col = jit(rng, base, 22);
    p.rect(2 + i * 10, 0, 10, 64, rgb(...col)).rect(2 + i * 10, 0, 1, 64, rgb(...col.map(v => v * 0.5)));
  }
  p.rect(0, 0, 2, 64, '#1a1410').rect(62, 0, 2, 64, '#1a1410');
  const iron = boss ? '#2a2a30' : '#3a3a40';
  p.rect(0, 10, 64, 5, iron).rect(0, 48, 64, 5, iron);
  for (let i = 4; i < 64; i += 10) { p.circ(i, 12.5, 1.2, '#8a8a90'); p.circ(i, 50.5, 1.2, '#8a8a90'); }
  p.circ(50, 32, 4, '#1a1a1a').circ(50, 32, 2.5, boss ? '#c05030' : '#9a8a50');
  if (boss) {
    p.ell(30, 31, 9, 8, '#d8ceb0').circ(27, 30, 2.5, '#300').circ(33, 30, 2.5, '#300').rect(26, 36, 8, 4, '#d8ceb0');
  }
  if (themeCol) p.rect(0, 0, 64, 2, themeCol);
  noisePass(c, rng, 12);
  return c;
}

function runeOverlay(c, seed, color) {
  const rng = mulberry32(seed), p = P(c.getContext('2d'));
  for (let i = 0; i < 3; i++) {
    const x = 10 + rng() * 44, y = 10 + rng() * 44;
    p.stroke(color, 1.2);
    const ctx = p.ctx; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.stroke();
    p.line(x - 5, y, x + 5, y, color, 1.2).line(x, y - 6, x, y + 6, color, 1.2);
  }
  return c;
}

// =========================== FLOOR / CEILING ==============================

function flagstones(seed, base, rows = 4) {
  return brickTex(seed, { base, mortar: base.map(v => v * 0.4), rows, cols: rows, jitter: 26, stagger: true, noise: 20, speck: 0.03 });
}
function dirtFloor(seed) {
  const rng = mulberry32(seed), c = cv(64, 64), p = P(c.getContext('2d'));
  p.rect(0, 0, 64, 64, '#3a3222');
  for (let i = 0; i < 90; i++) p.ell(rng() * 64, rng() * 64, 1 + rng() * 4, 1 + rng() * 2, rgb(50 + rng() * 30, 44 + rng() * 26, 28 + rng() * 14));
  for (let i = 0; i < 25; i++) { const x = rng() * 64, y = rng() * 64; p.line(x, y, x + (rng() - .5) * 3, y - 3, rgb(50, 110, 40), 1); }
  noisePass(c, rng, 18);
  return c;
}
function boneFloor(seed) {
  const rng = mulberry32(seed), c = flagstones(seed, [70, 66, 60]), p = P(c.getContext('2d'));
  for (let i = 0; i < 14; i++) {
    const x = rng() * 64, y = rng() * 64, a = rng() * 3, l = 3 + rng() * 5;
    p.line(x, y, x + Math.cos(a) * l, y + Math.sin(a) * l, '#c8bc9c', 1.5);
  }
  return c;
}
function grateFloor(seed) {
  const rng = mulberry32(seed), c = cv(64, 64), p = P(c.getContext('2d'));
  p.rect(0, 0, 64, 64, '#2a0a04');
  for (let i = 0; i < 40; i++) p.circ(rng() * 64, rng() * 64, 1 + rng() * 3, rgb(200 + rng() * 55, 60 + rng() * 80, 10));
  for (let i = 0; i < 64; i += 8) { p.rect(i, 0, 3, 64, '#3a3432'); p.rect(0, i, 64, 3, '#3a3432'); }
  p.rect(0, 0, 64, 2, '#4a4442').rect(0, 0, 2, 64, '#4a4442');
  noisePass(c, rng, 10);
  return c;
}
function checkerFloor(seed) {
  const rng = mulberry32(seed), c = cv(64, 64), p = P(c.getContext('2d'));
  for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) p.rect(x * 16, y * 16, 16, 16, (x + y) % 2 ? '#1a1420' : '#cfc6d8');
  noisePass(c, rng, 10);
  return c;
}
function rugFloor(seed) {
  const rng = mulberry32(seed), c = cv(64, 64), p = P(c.getContext('2d'));
  p.rect(0, 0, 64, 64, '#7a1e22');
  p.rect(4, 4, 56, 56, '#9a2a28').rect(8, 8, 48, 48, '#7a1e22');
  p.poly([32, 14, 50, 32, 32, 50, 14, 32], '#c8943a').poly([32, 20, 44, 32, 32, 44, 20, 32], '#7a1e22');
  p.circ(32, 32, 4, '#e0b050');
  for (let i = 0; i < 64; i += 4) { p.rect(i, 0, 2, 2, '#e0b050'); p.rect(i, 62, 2, 2, '#e0b050'); }
  noisePass(c, rng, 14);
  return c;
}
function darkCeil(seed, base) {
  const rng = mulberry32(seed), c = cv(64, 64), p = P(c.getContext('2d'));
  p.rect(0, 0, 64, 64, rgb(...base));
  for (let i = 0; i < 50; i++) p.ell(rng() * 64, rng() * 64, 2 + rng() * 6, 1 + rng() * 4, rgb(...jit(rng, base, 22)));
  noisePass(c, rng, 12);
  return c;
}
function beamCeil(seed) {
  const c = darkCeil(seed, [40, 36, 34]), p = P(c.getContext('2d'));
  p.rect(0, 26, 64, 12, '#4a2e1a').rect(0, 26, 64, 2, '#6a4428').rect(0, 36, 64, 2, '#2a1a0e');
  return c;
}
function trussCeil(seed) {
  const rng = mulberry32(seed), c = cv(64, 64), p = P(c.getContext('2d'));
  p.rect(0, 0, 64, 64, '#0c0812');
  p.rect(0, 28, 64, 8, '#3a3a44');
  for (let i = 0; i < 64; i += 8) p.line(i, 28, i + 8, 36, '#5a5a66', 1.5);
  p.circ(16, 16, 5, '#2a2a2a').circ(16, 16, 3, '#ffe9a0').circ(48, 48, 5, '#2a2a2a').circ(48, 48, 3, '#ff90e0');
  noisePass(c, rng, 6);
  return c;
}

// Build a texture set for a floor theme. Keys match tile ids in map.js.
function buildTheme(theme, seed) {
  const T = {};
  switch (theme) {
    case 'stone':
      T.wall = stoneWall(seed, [110, 104, 96]); T.wall2 = mossify(stoneWall(seed + 1, [100, 96, 90]), seed, 20);
      T.floor = flagstones(seed + 2, [84, 78, 70]); T.ceil = darkCeil(seed + 3, [44, 40, 38]);
      T.bossWall = runeOverlay(stoneWall(seed + 4, [96, 70, 64]), seed, '#ff4030');
      break;
    case 'moss':
      T.wall = mossify(brickTex(seed, { base: [70, 84, 60], mortar: [30, 36, 24], rows: 8, cols: 4, jitter: 30, cracks: 0.2 }), seed, 45);
      T.wall2 = mossify(stoneWall(seed + 1, [80, 86, 64]), seed + 1, 80);
      T.floor = dirtFloor(seed + 2); T.ceil = beamCeil(seed + 3);
      T.bossWall = runeOverlay(mossify(stoneWall(seed + 4, [90, 70, 50]), seed + 4, 30), seed, '#ffd040');
      break;
    case 'bone':
      T.wall = boneWall(seed); T.wall2 = stoneWall(seed + 1, [80, 78, 86]);
      T.floor = boneFloor(seed + 2); T.ceil = darkCeil(seed + 3, [30, 28, 34]);
      T.bossWall = runeOverlay(boneWall(seed + 4), seed, '#70ffd0');
      break;
    case 'furnace':
      T.wall = furnaceWall(seed, false); T.wall2 = furnaceWall(seed + 1, true);
      T.floor = grateFloor(seed + 2); T.ceil = darkCeil(seed + 3, [36, 16, 12]);
      T.bossWall = runeOverlay(furnaceWall(seed + 4, false), seed, '#ffe060');
      break;
    default:
      T.wall = studioWall(seed, false); T.wall2 = studioWall(seed + 1, true);
      T.floor = checkerFloor(seed + 2); T.ceil = trussCeil(seed + 3);
      T.bossWall = runeOverlay(studioWall(seed + 4, false), seed, '#ff2020');
  }
  T.safeWall = woodWall(seed + 5);
  T.safeFloor = rugFloor(seed + 6);
  T.door = doorTex(seed + 7, false);
  T.bossDoor = doorTex(seed + 8, true);
  const out = {};
  for (const k in T) out[k] = toTex(relief(T[k], k === 'ceil' ? 1.0 : 1.5));
  return out;
}

// ============================== SPRITES ===================================

// Lay a standing sprite on its side with a blood pool: the corpse frame.
function corpseOf(frame, bloodCol = '#6a0808') {
  const w = frame.width / ART_SCALE, h = frame.height / ART_SCALE;
  const c = cv(w, h), x = c.getContext('2d');
  x.fillStyle = bloodCol; x.beginPath(); x.ellipse(w / 2, h - 3, w * 0.45, 3, 0, 0, Math.PI * 2); x.fill();
  x.save(); x.translate(w / 2, h - 2); x.rotate(-Math.PI / 2); x.scale(0.55, 1);
  x.drawImage(frame, -w * 0.1, -w / 2, h * 0.9, w);
  x.restore();
  return c;
}

function drawRat(f, king) {
  const W = 64, H = king ? 64 : 40, c = cv(W, H), p = P(c.getContext('2d'));
  const by = H - 14, bob = f === 1 ? 2 : 0, fur = king ? '#5a4a52' : '#6b5d52', dark = king ? '#3a2e36' : '#4a3e36';
  const s = king ? 1.5 : 1;
  if (king) p.poly([10, by - 18, 44, by - 22, 48, by + 8, 6, by + 10], '#8a1a30'); // royal cape
  p.line(8, by + 2, 2, by - 10 + bob, '#c09090', 2.5 * s); // tail
  p.ell(30, by - bob, 20 * s * 0.8, 10 * s * 0.8, fur).ell(30, by + 3 - bob, 16 * s * 0.8, 6 * s * 0.8, '#8a7a6a');
  const leg = f === 1 ? 3 : 0;
  p.rect(18 - leg, by + 4, 4, 9, dark).rect(38 + leg, by + 4, 4, 9, dark);
  const hx = f === 2 ? 50 : 46, hy = by - 4 - bob;
  p.ell(hx, hy, 11 * s * 0.8, 8 * s * 0.8, fur).circ(hx - 5, hy - 8 * s * 0.8, 4 * s * 0.8, '#c09090');
  p.circ(hx + 4, hy - 2, 2 * s, '#ff2020').circ(hx + 10 * s * 0.8, hy + 2, 2, '#301818');
  if (f === 2) { p.rect(hx + 5, hy + 4, 2, 5, '#fff').rect(hx + 8, hy + 4, 2, 5, '#fff'); } else p.rect(hx + 6, hy + 4, 3, 3, '#fff');
  if (king) { // crown and cape
    p.poly([hx - 12, hy - 14, hx - 10, hy - 26, hx - 5, hy - 18, hx, hy - 28, hx + 5, hy - 18, hx + 9, hy - 25, hx + 10, hy - 14], '#ffcc33');
    p.circ(hx, hy - 21, 2, '#e02040');
  }
  return c;
}

function drawGoblin(f, kind) {
  const W = 48, H = 64, c = cv(W, H), p = P(c.getContext('2d'));
  const skin = kind === 'slinger' ? '#6a9a3a' : '#5c8c34', skinD = '#3e6420';
  const step = f === 1 ? 4 : f === 0 ? -2 : 0;
  p.rect(16 + step, 44, 6, 18, skinD).rect(27 - step, 44, 6, 18, skinD); // legs
  p.rect(14 + step, 60, 9, 4, '#2a1a10').rect(26 - step, 60, 9, 4, '#2a1a10');
  p.ell(24, 36, 11, 12, skin); // torso
  p.poly([13, 40, 35, 40, 38, 52, 10, 52], kind === 'slinger' ? '#8a4a1a' : '#6a4424');
  if (kind === 'slinger') p.poly([12, 26, 36, 26, 30, 44, 18, 44], '#b0621e'); // hood cloak
  // head
  p.circ(24, 18, 10, skin);
  p.poly([15, 16, 1, 8, 15, 22], skin).poly([33, 16, 47, 8, 33, 22], skin); // ears
  p.circ(20, 17, 2.4, '#ffe040').circ(28, 17, 2.4, '#ffe040').circ(20, 17, 1, '#000').circ(28, 17, 1, '#000');
  p.rect(18, 23, 12, 3, '#2a0a0a');
  for (let i = 0; i < 4; i++) p.rect(19 + i * 3, 23, 1.5, 2, '#fff');
  if (kind === 'slinger') p.ell(24, 10, 11, 5, '#b0621e');
  // arms / weapon
  if (kind === 'slinger') {
    const up = f === 2;
    p.line(14, 30, up ? 6 : 8, up ? 12 : 42, skin, 4);
    p.line(34, 30, 40, 40, skin, 4);
    if (up) { p.line(6, 12, 12, 2, '#6a4a2a', 1).circ(12, 2, 3, '#888'); } else p.line(8, 42, 6, 52, '#6a4a2a', 1);
  } else {
    const up = f === 2;
    p.line(14, 30, 8, 42, skin, 4);
    p.line(34, 30, up ? 42 : 40, up ? 18 : 40, skin, 4);
    if (up) p.poly([41, 18, 46, 2, 44, 18], '#c8c8d0'); else p.poly([39, 40, 44, 54, 41, 40], '#c8c8d0');
  }
  return c;
}

function drawMatriarch(f) {
  const W = 64, H = 80, c = cv(W, H), p = P(c.getContext('2d'));
  const skin = '#4e7c2c', step = f === 1 ? 3 : 0;
  p.rect(20 + step, 58, 9, 20, '#35541c').rect(35 - step, 58, 9, 20, '#35541c');
  p.ell(32, 46, 22, 22, skin); // big belly
  p.poly([10, 50, 54, 50, 58, 70, 6, 70], '#6a2a5a'); // skirt
  p.ell(32, 42, 14, 10, '#6a2a5a');
  for (let i = 0; i < 6; i++) p.circ(18 + i * 5.5, 34, 2.5, '#e0e0e0'); // necklace of teeth
  p.circ(32, 20, 13, skin);
  p.poly([20, 18, 2, 6, 20, 26], skin).poly([44, 18, 62, 6, 44, 26], skin);
  p.circ(27, 18, 3, '#ffcc00').circ(37, 18, 3, '#ffcc00').circ(27, 18, 1.3, '#000').circ(37, 18, 1.3, '#000');
  p.rect(24, 26, 16, 4, '#2a0a0a').rect(26, 26, 2, 3, '#fff').rect(36, 26, 2, 3, '#fff');
  p.poly([20, 8, 22, -2, 27, 5, 32, -4, 37, 5, 42, -2, 44, 8], '#ffcc33'); // crown
  const up = f === 2;
  p.line(12, 38, up ? 4 : 4, up ? 16 : 52, skin, 6);
  p.line(52, 38, up ? 60 : 60, up ? 16 : 52, skin, 6);
  p.circ(up ? 4 : 4, up ? 14 : 54, 5, '#888'); // a rock in each hand
  p.circ(up ? 60 : 60, up ? 14 : 54, 5, '#888');
  return c;
}

function drawSkeleton(f, big) {
  const W = big ? 64 : 48, H = big ? 80 : 64, c = cv(W, H), p = P(c.getContext('2d'));
  const bone = big ? '#e4dcc4' : '#d8d0b8', cx = W / 2, s = big ? 1.25 : 1;
  const step = f === 1 ? 3 : f === 0 ? -2 : 0;
  const hip = H - 22 * s;
  p.line(cx - 4, hip, cx - 6 + step, H - 2, bone, 3 * s).line(cx + 4, hip, cx + 6 - step, H - 2, bone, 3 * s);
  p.line(cx, hip, cx, hip - 22 * s, bone, 3 * s); // spine
  for (let i = 0; i < 4; i++) p.line(cx - 9 * s, hip - 8 * s - i * 4 * s, cx + 9 * s, hip - 8 * s - i * 4 * s, bone, 2);
  p.ell(cx, hip, 8 * s, 3 * s, bone);
  const sh = hip - 22 * s;
  p.line(cx - 10 * s, sh, cx + 10 * s, sh, bone, 3);
  // skull
  p.ell(cx, sh - 9 * s, 8 * s, 8 * s, bone).rect(cx - 5 * s, sh - 5 * s, 10 * s, 5 * s, bone);
  p.circ(cx - 3 * s, sh - 10 * s, 2.2 * s, big ? '#40ffc0' : '#200').circ(cx + 3 * s, sh - 10 * s, 2.2 * s, big ? '#40ffc0' : '#200');
  const up = f === 2;
  if (big) { // four arms and a staff
    p.line(cx - 10 * s, sh, cx - 22, sh + 16, bone, 2.5).line(cx + 10 * s, sh, cx + 22, sh + 16, bone, 2.5);
    p.line(cx - 10 * s, sh + 6, cx - 24, up ? sh - 18 : sh + 2, bone, 2.5).line(cx + 10 * s, sh + 6, cx + 24, up ? sh - 18 : sh + 2, bone, 2.5);
    p.line(cx + 24, up ? sh - 30 : sh - 14, cx + 24, H - 2, '#5a3a20', 3).circ(cx + 24, up ? sh - 32 : sh - 16, 5, '#40ffc0');
    p.poly([cx - 10, sh - 24, cx - 6, sh - 34, cx, sh - 26, cx + 6, sh - 34, cx + 10, sh - 24], '#b0a888'); // bone crown
  } else {
    p.line(cx - 10, sh, cx - 14, sh + 18, bone, 2.5);
    p.line(cx + 10, sh, up ? cx + 18 : cx + 14, up ? sh - 8 : sh + 16, bone, 2.5);
    if (up) p.line(cx + 18, sh - 8, cx + 20, sh - 30, '#b0b8c0', 3); else p.line(cx + 14, sh + 16, cx + 22, sh + 34, '#b0b8c0', 3);
  }
  return c;
}

function drawBrute(f) {
  const W = 64, H = 72, c = cv(W, H), p = P(c.getContext('2d'));
  const skin = '#6a7a8a', dark = '#4a5864', step = f === 1 ? 3 : 0;
  p.rect(18 + step, 50, 11, 22, dark).rect(35 - step, 50, 11, 22, dark);
  p.ell(32, 38, 22, 20, skin).ell(32, 44, 16, 10, '#8a98a4');
  p.poly([12, 50, 52, 50, 50, 60, 14, 60], '#5a3a22');
  p.circ(32, 16, 11, skin).rect(22, 18, 20, 8, skin);
  p.rect(22, 11, 20, 4, dark); // brow
  p.circ(27, 17, 2, '#ffa020').circ(37, 17, 2, '#ffa020');
  p.poly([26, 25, 28, 30, 30, 25], '#fff').poly([34, 25, 36, 30, 38, 25], '#fff'); // tusks
  const up = f === 2;
  p.line(10, 30, 4, 50, skin, 8);
  p.line(54, 30, up ? 58 : 60, up ? 12 : 48, skin, 8);
  if (up) p.line(58, 12, 50, -4, '#6a4a2a', 7).circ(50, 2, 7, '#5a3a1a');
  else p.line(60, 48, 62, 70, '#6a4a2a', 7).circ(62, 66, 7, '#5a3a1a');
  return c;
}

function drawWisp(f) {
  const c = cv(40, 40), p = P(c.getContext('2d'));
  const fl = f % 2;
  p.circ(20, 22, 16, 'rgba(255,90,20,0.55)');
  p.poly([6, 24, 12, fl ? 2 : 6, 18, 14, 22, fl ? 0 : 4, 26, 12, 32, fl ? 4 : 2, 34, 24], '#ff6a10');
  p.circ(20, 24, 12, '#ff9a20').circ(20, 26, 8, '#ffe070');
  p.circ(16, 24, 2, '#400').circ(24, 24, 2, '#400');
  p.ell(20, 30, 3, f === 2 ? 3 : 1.5, '#400');

}

function drawHound(f) {
  const W = 80, H = 60, c = cv(W, H), p = P(c.getContext('2d'));
  const fur = '#8a1a10', dark = '#4a0a06', step = f === 1 ? 5 : 0;
  // flames on back
  for (let i = 0; i < 7; i++) p.poly([18 + i * 7, 22, 21 + i * 7, 6 + (i + f) % 3 * 4, 24 + i * 7, 22], i % 2 ? '#ffb020' : '#ff5010');
  p.ell(36, 30, 24, 12, fur);
  p.rect(18 - step, 36, 6, 22, dark).rect(28 + step, 36, 6, 22, dark).rect(42 - step, 36, 6, 22, dark).rect(52 + step, 36, 6, 22, dark);
  p.line(12, 28, 2, 16 - step, fur, 4); // tail

  p.circ(hx + 2, 22, 2.5, '#ffe020');
  p.rect(hx + 4, 30, 14, f === 2 ? 5 : 2, '#200');
  if (f === 2) for (let i = 0; i < 4; i++) p.poly([hx + 5 + i * 3.5, 30, hx + 6.5 + i * 3.5, 33, hx + 8 + i * 3.5, 30], '#fff');
  p.rect(hx - 6, 30, 12, 3, '#333').circ(hx - 2, 31.5, 1.5, '#aaa'); // collar with tag
  return c;
}

function drawShowrunner(f) {
  const W = 56, H = 84, c = cv(W, H), p = P(c.getContext('2d'));
  const step = f === 1 ? 3 : 0;
  p.rect(18 + step, 58, 8, 24, '#1a1a22').rect(30 - step, 58, 8, 24, '#1a1a22');
  p.rect(16 + step, 80, 11, 4, '#000').rect(29 - step, 80, 11, 4, '#000');
  p.poly([12, 30, 44, 30, 42, 62, 14, 62], '#2a2a3a'); // suit

const SPR = {};

    step() { noise(0.05, 0.05, 'lowpass', 500, 200); },
  };

  function play(name) {
    if (!ac || !fx[name]) return;
    try { fx[name](); } catch (e) { /* audio is best-effort */ }
  }

  // --- generative soundtrack: bass drone + minor arpeggio per floor theme ---
  const SCALES = [
    [0, 3, 5, 7, 10], [0, 2, 3, 7, 8], [0, 1, 5, 7, 8], [0, 3, 6, 7, 10], [0, 3, 5, 6, 7, 10],
  ];
  const ROOTS = [45, 43, 41, 40, 44];
  const midi = n => 440 * Math.pow(2, (n - 69) / 12);

  function startMusic() {
    if (musicTimer) return;
    nextTime = ac.currentTime + 0.1;
    musicTimer = setInterval(schedule, 50);
  }

  function schedule() {
    if (!ac) return;
    const bpm = 96 + intensity * 30;
    const stepDur = 60 / bpm / 2;
    while (nextTime < ac.currentTime + 0.2) {
      if (musicOn) playStep(step, nextTime, stepDur);
      step++;
      nextTime += stepDur;
    }
  }

  function note(type, freq, t, dur, vol, cutoff) {
    const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
    o.type = type; o.frequency.value = freq;
    f.type = 'lowpass'; f.frequency.value = cutoff;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function playStep(s, t, d) {
    const sc = SCALES[theme % SCALES.length], root = ROOTS[theme % ROOTS.length];
    const bar = Math.floor(s / 16) % 4;
    const shift = [0, 0, 5, 3][bar];
    if (s % 8 === 0) note('sawtooth', midi(root - 12 + shift), t, d * 7, 0.22, 300);
    if (s % 4 === 2 && intensity > 0.3) note('square', midi(root + shift), t, d * 0.9, 0.05, 900);
    const pat = [0, 2, 1, 3, 2, 4, 3, 1];
    if (s % 2 === 0 || intensity > 0.5) {
      const deg = pat[(s >> (intensity > 0.5 ? 0 : 1)) % pat.length];
      const n = root + 12 + shift + sc[deg % sc.length] + (deg >= sc.length ? 12 : 0);
      note('triangle', midi(n), t, d * 1.6, 0.06 + intensity * 0.04, 2000);
    }
    // percussion
    if (s % 8 === 0 || (intensity > 0.5 && s % 8 === 5)) kickDrum(t);
    if (s % 8 === 4) hat(t, 0.08);
    if (intensity > 0.3 && s % 2 === 1) hat(t, 0.03);
  }

  function kickDrum(t) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15);
    g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }

  function hat(t, v) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
    const g = ac.createGain();
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    s.connect(f); f.connect(g); g.connect(musicBus); s.start(t, Math.random()); s.stop(t + 0.06);
  }

  return {
    init, play,
    setTheme(i) { theme = i; },
    setIntensity(v) { intensity += (v - intensity) * 0.05; },
    toggleMusic() { musicOn = !musicOn; return musicOn; },
    get musicOn() { return musicOn; },
    setSfx(v) { sfxVol = v; if (sfxBus) sfxBus.gain.value = v; },
    setMusic(v) { musicVol = v; if (musicBus) musicBus.gain.value = v; },
    get sfxVol() { return sfxVol; },
    get musicVol() { return musicVol; },
  };
})();

<script>
'use strict';
// ---------------------------------------------------------------------------
// Dungeon generation (rooms + corridors), line of sight, and the BFS flow
// field monsters use to chase the player through corridors.
// ---------------------------------------------------------------------------

const T_EMPTY = 0, T_WALL = 1, T_WALL2 = 2, T_SAFE = 3, T_BOSS = 4, T_DOOR = 8, T_BOSSDOOR = 9;
const Z_NORMAL = 0, Z_SAFE = 1, Z_BOSS = 2;

// Flame tint and light color for each floor's braziers.
const THEME_LIGHTS = {
  stone: [['fire', [1.0, 0.62, 0.3]]],
  moss: [['fire', [1.0, 0.7, 0.36]]],
  bone: [['ghost', [0.3, 0.8, 0.58]]],
  furnace: [['hot', [1.0, 0.42, 0.16]]],
  studio: [['pink', [1.0, 0.3, 0.8]], ['cyan', [0.3, 0.8, 1.0]]],
};

class Dungeon {
  constructor(floorIdx, seed) {
    this.floorIdx = floorIdx;
    const rng = this.rng = mulberry32(seed);
    const W = this.W = 52 + floorIdx * 4, H = this.H = 52 + floorIdx * 4;
    this.tiles = new Uint8Array(W * H).fill(T_WALL);
    this.zone = new Uint8Array(W * H);
    this.door = new Float32Array(W * H);     // 0 closed .. 1 open
    this.doorMoving = new Uint8Array(W * H);
    this.seen = new Uint8Array(W * H);
    this.lr = new Float32Array(W * H); this.lg = new Float32Array(W * H); this.lb = new Float32Array(W * H);
    // light sampled at cell corners (vertices), static and per-frame copies
    const V = (W + 1) * (H + 1);
    this.svr = new Float32Array(V); this.svg = new Float32Array(V); this.svb = new Float32Array(V);
    this.vr = new Float32Array(V); this.vg = new Float32Array(V); this.vb = new Float32Array(V);
    this.flow = new Int16Array(W * H);
    this.flowFrom = -1;
    this.spawns = { mobs: [], chests: [], items: [], decor: [], lights: [] };
    this.generate(rng);
  }

  idx(x, y) { return y * this.W + x; }
  inside(x, y) { return x >= 0 && y >= 0 && x < this.W && y < this.H; }
  tileAt(x, y) { return this.inside(x, y) ? this.tiles[y * this.W + x] : T_WALL; }
  isDoorTile(t) { return t === T_DOOR || t === T_BOSSDOOR; }

  // Blocks movement: walls and doors that are not (mostly) open.
  solid(x, y) {
    x |= 0; y |= 0;
    if (!this.inside(x, y)) return true;
    const i = y * this.W + x, t = this.tiles[i];
    if (t === T_EMPTY) return false;
    if (t === T_DOOR || t === T_BOSSDOOR) return this.door[i] < 0.85;
    return true;
  }
  blocksSight(x, y) {
    x |= 0; y |= 0;
    if (!this.inside(x, y)) return true;
    const i = y * this.W + x, t = this.tiles[i];
    if (t === T_EMPTY) return false;
    if (t === T_DOOR || t === T_BOSSDOOR) return this.door[i] < 0.6;
    return true;
  }
  passable(i) { const t = this.tiles[i]; return t === T_EMPTY || t === T_DOOR || t === T_BOSSDOOR; }

  generate(rng) {
    const { W, H } = this;
    const ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
    const rooms = this.rooms = [];
    const overlaps = (r) => rooms.some(o => r.x - 2 < o.x + o.w && r.x + r.w + 2 > o.x && r.y - 2 < o.y + o.h && r.y + r.h + 2 > o.y);
    // safe room first: fixed size
    for (let tries = 0; tries < 200 && rooms.length === 0; tries++) {
      const r = { x: ri(2, W - 9), y: ri(2, H - 9), w: 6, h: 6 };
      rooms.push(r);
    }
    const target = 17 + this.floorIdx * 2;
    for (let tries = 0; tries < 600 && rooms.length < target; tries++) {
      const big = rng() < 0.3;
      const w = big ? ri(8, 11) : ri(4, 8), h = big ? ri(8, 11) : ri(4, 8);
      const r = { x: ri(2, W - w - 2), y: ri(2, H - h - 2), w, h };
      if (!overlaps(r)) rooms.push(r);
    }
    rooms.forEach(r => { r.cx = r.x + (r.w >> 1); r.cy = r.y + (r.h >> 1); });
    for (const r of rooms) this.carveRect(r.x, r.y, r.w, r.h);

    // connect rooms: Prim's tree + a few loops
    const connected = [0], edges = [];
    const remaining = rooms.map((_, i) => i).slice(1);
    while (remaining.length) {
      let best = null, bd = 1e9;
      for (const a of connected) for (const b of remaining) {
        const d = Math.abs(rooms[a].cx - rooms[b].cx) + Math.abs(rooms[a].cy - rooms[b].cy);
        if (d < bd) { bd = d; best = [a, b]; }
      }
      edges.push(best); connected.push(best[1]); remaining.splice(remaining.indexOf(best[1]), 1);
    }
    for (let k = 0; k < 5; k++) {
      const a = 1 + Math.floor(rng() * (rooms.length - 1)), b = 1 + Math.floor(rng() * (rooms.length - 1));
      if (a !== b) edges.push([a, b]);
    }
    // pick boss room after the tree exists (needs distances), so carve first
    for (const [a, b] of edges) this.corridor(rooms[a], rooms[b], rng, a === 0 || b === 0 ? 1 : (rng() < 0.3 ? 2 : 1));

    const safe = this.safeRoom = rooms[0];
    this.start = { x: safe.cx + 0.5, y: safe.cy + 0.5 };
    const dist = this.bfs(safe.cx, safe.cy);
    let bossRoom = null, bdist = -1;
    for (const r of rooms.slice(1)) {
      const d = dist[this.idx(r.cx, r.cy)] + (r.w >= 7 && r.h >= 7 ? 12 : 0);
      if (d > bdist) { bdist = d; bossRoom = r; }
    }
    this.bossRoom = bossRoom;

    // zones
    for (let y = safe.y; y < safe.y + safe.h; y++) for (let x = safe.x; x < safe.x + safe.w; x++) this.zone[this.idx(x, y)] = Z_SAFE;
    for (let y = bossRoom.y; y < bossRoom.y + bossRoom.h; y++) for (let x = bossRoom.x; x < bossRoom.x + bossRoom.w; x++) this.zone[this.idx(x, y)] = Z_BOSS;

    // doors
    for (const r of rooms) this.placeDoors(r, r === safe ? 1 : r === bossRoom ? 2 : 0, rng);

    // wall dressing
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = this.idx(x, y);
      if (this.tiles[i] !== T_WALL) continue;
      let nearSafe = false, nearBoss = false;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!this.inside(x + dx, y + dy)) continue;
        const z = this.zone[this.idx(x + dx, y + dy)], t = this.tiles[this.idx(x + dx, y + dy)];
        if (t === T_EMPTY && z === Z_SAFE) nearSafe = true;
        if (t === T_EMPTY && z === Z_BOSS) nearBoss = true;
      }
      if (nearSafe) this.tiles[i] = T_SAFE;
      else if (nearBoss) this.tiles[i] = T_BOSS;
      else if (rng() < 0.1) this.tiles[i] = T_WALL2;
    }

    this.stairs = { x: bossRoom.cx + 0.5, y: bossRoom.cy + 0.5 };
    this.mordecai = { x: safe.x + 0.7, y: safe.y + 0.7 };
    this.populate(rng, dist);
    this.computeLight();
  }

  carveRect(x, y, w, h) {
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (this.inside(i, j)) this.tiles[this.idx(i, j)] = T_EMPTY;
  }

  corridor(a, b, rng, width) {
    let x = a.cx, y = a.cy;
    const horizFirst = rng() < 0.5;
    const carve = (cx, cy) => {
      for (let k = 0; k < width; k++) {
        const i = cx + (horizFirst ? 0 : k), j = cy + (horizFirst ? k : 0);
        if (i > 0 && j > 0 && i < this.W - 1 && j < this.H - 1) this.tiles[this.idx(i, j)] = T_EMPTY;
      }
    };
    const stepX = () => { while (x !== b.cx) { x += Math.sign(b.cx - x); carve(x, y); } };
    const stepY = () => { while (y !== b.cy) { y += Math.sign(b.cy - y); carve(x, y); } };
    if (horizFirst) { stepX(); stepY(); } else { stepY(); stepX(); }
  }

  placeDoors(r, special, rng) {
    const wallish = (x, y) => { const t = this.tileAt(x, y); return t !== T_EMPTY && !this.isDoorTile(t); };
    const tryDoor = (x, y, horizontalSide) => {
      if (!this.inside(x, y) || this.tileAt(x, y) !== T_EMPTY) return;
      const ok = horizontalSide ? (wallish(x - 1, y) && wallish(x + 1, y)) : (wallish(x, y - 1) && wallish(x, y + 1));
      if (!ok) return;
      if (special || rng() < 0.4) {
        this.tiles[this.idx(x, y)] = special === 2 ? T_BOSSDOOR : T_DOOR;
        if (special === 1) this.zone[this.idx(x, y)] = Z_SAFE;
      }
    };
    for (let x = r.x; x < r.x + r.w; x++) { tryDoor(x, r.y - 1, true); tryDoor(x, r.y + r.h, true); }
    for (let y = r.y; y < r.y + r.h; y++) { tryDoor(r.x - 1, y, false); tryDoor(r.x + r.w, y, false); }
  }

  bfs(sx, sy) {
    const { W, H } = this, dist = new Int16Array(W * H).fill(-1), q = new Int32Array(W * H);
    let h = 0, t = 0;
    const s = this.idx(sx, sy); dist[s] = 0; q[t++] = s;
    while (h < t) {
      const i = q[h++], x = i % W, y = (i / W) | 0, d = dist[i] + 1;
      const n = [i - 1, i + 1, i - W, i + W];
      if (x === 0) n[0] = -1; if (x === W - 1) n[1] = -1; if (y === 0) n[2] = -1; if (y === H - 1) n[3] = -1;
      for (const j of n) if (j >= 0 && dist[j] < 0 && this.passable(j)) { dist[j] = d; q[t++] = j; }
    }
    return dist;
  }

  updateFlow(px, py) {
    const i = this.idx(px | 0, py | 0);
    if (i === this.flowFrom) return;
    this.flowFrom = i;
    this.flow = this.bfs(px | 0, py | 0);
  }

  // Direction (unit vector) a monster at (x,y) should step to approach the player.
  flowDir(x, y) {
    const cx = x | 0, cy = y | 0, W = this.W;
    const here = this.flow[this.idx(cx, cy)];
    let best = here < 0 ? 1e9 : here, bx = -1, by = -1;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = cx + dx, ny = cy + dy;
      if (!this.inside(nx, ny)) continue;
      const d = this.flow[ny * W + nx];
      if (d < 0) continue;
      if (dx && dy && (!this.passable(cy * W + nx) || !this.passable(ny * W + cx))) continue;
      if (d < best) { best = d; bx = nx; by = ny; }
    }
    if (bx < 0) return null;
    const tx = bx + 0.5 - x, ty = by + 0.5 - y, l = Math.hypot(tx, ty) || 1;
    return { x: tx / l, y: ty / l, cell: by * W + bx };
  }

  los(x0, y0, x1, y1) {
    const dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy), n = Math.ceil(d * 4);
    for (let k = 1; k < n; k++) {
      const t = k / n;
      if (this.blocksSight(x0 + dx * t, y0 + dy * t)) return false;
    }
    return true;
  }

  randomCellIn(r, rng, margin = 0) {
    return {
      x: r.x + margin + Math.floor(rng() * (r.w - margin * 2)) + 0.5,
      y: r.y + margin + Math.floor(rng() * (r.h - margin * 2)) + 0.5,
    };
  }

  populate(rng, dist) {
    const F = FLOORS[this.floorIdx], sp = this.spawns;
    const normalRooms = this.rooms.filter(r => r !== this.safeRoom && r !== this.bossRoom);
    const used = new Set();
    const free = (x, y) => {
      const i = this.idx(x | 0, y | 0);
      return this.tiles[i] === T_EMPTY && !used.has(i);
    };
    const claim = (x, y) => used.add(this.idx(x | 0, y | 0));
    used.add(this.idx(this.stairs.x | 0, this.stairs.y | 0));

    // monsters
    for (let k = 0, tries = 0; k < F.count && tries < 2000; tries++) {
      let p;
      if (rng() < 0.75 && normalRooms.length) p = this.randomCellIn(normalRooms[Math.floor(rng() * normalRooms.length)], rng);
      else p = { x: 1 + Math.floor(rng() * (this.W - 2)) + 0.5, y: 1 + Math.floor(rng() * (this.H - 2)) + 0.5 };
      const i = this.idx(p.x | 0, p.y | 0);
      if (!free(p.x, p.y) || this.zone[i] !== Z_NORMAL || dist[i] < 8) continue;
      claim(p.x, p.y);
      sp.mobs.push({ type: F.pool[Math.floor(rng() * F.pool.length)], x: p.x, y: p.y });
      k++;
    }
    // boss guards the stairs
    const br = this.bossRoom;
    sp.boss = { type: F.boss, x: br.cx + 0.5, y: Math.max(br.y + 0.5, br.cy - 1.5) };

    // chests in room corners
    const nChests = 4 + Math.floor(this.floorIdx / 2);
    for (let k = 0, tries = 0; k < nChests && tries < 200; tries++) {
      const r = normalRooms[Math.floor(rng() * normalRooms.length)];
      if (!r) break;
      const x = (rng() < 0.5 ? r.x : r.x + r.w - 1) + 0.5, y = (rng() < 0.5 ? r.y : r.y + r.h - 1) + 0.5;
      if (!free(x, y)) continue;
      claim(x, y); sp.chests.push({ x, y }); k++;
    }
    // loose items
    const loose = [['coins', 10], ['potion', 3], ['bolts', 3], ['lobbers', 2]];
    for (const [kind, n] of loose) for (let k = 0, tries = 0; k < n && tries < 200; tries++) {
      const r = normalRooms[Math.floor(rng() * normalRooms.length)];
      if (!r) break;
      const p = this.randomCellIn(r, rng);
      if (!free(p.x, p.y)) continue;
      claim(p.x, p.y); sp.items.push({ kind, x: p.x + (rng() - 0.5) * 0.4, y: p.y + (rng() - 0.5) * 0.4 }); k++;
    }
    // light sources + decor
    const theme = F.theme, tl = THEME_LIGHTS[theme];
    let li = 0;
    for (const r of this.rooms) {
      const corners = [[r.x + 0.5, r.y + 0.5], [r.x + r.w - 0.5, r.y + r.h - 0.5], [r.x + r.w - 0.5, r.y + 0.5], [r.x + 0.5, r.y + r.h - 0.5]];
      const n = r === this.safeRoom ? 0 : r === this.bossRoom ? 4 : 1 + (rng() < 0.5 ? 1 : 0);
      for (let k = 0; k < n; k++) {
        const [x, y] = corners[(k + (r === this.bossRoom ? 0 : Math.floor(rng() * 4))) % 4];
        if (!free(x, y)) continue;
        claim(x, y);
        const [tint, col] = r === this.bossRoom && theme !== 'bone' && theme !== 'studio' ? ['hot', [1.0, 0.36, 0.18]] : tl[li++ % tl.length];
        sp.decor.push({ kind: 'brazier', x, y, tint });
        sp.lights.push({ x, y, s: 1.05, r: 5.5, c: col });
      }
      if (r === this.safeRoom) continue;
      const extra = 1 + Math.floor(rng() * 3);
      for (let k = 0; k < extra; k++) {
        const p = this.randomCellIn(r, rng);
        if (!free(p.x, p.y)) continue;
        claim(p.x, p.y);
        const kind = theme === 'studio' ? (rng() < 0.5 ? 'camera' : 'barrel') : theme === 'bone' ? 'bones' : (rng() < 0.5 ? 'bones' : 'barrel');
        sp.decor.push({ kind, x: p.x + (rng() - 0.5) * 0.5, y: p.y + (rng() - 0.5) * 0.5 });
      }
    }
    // the safe room glows warmly; the stairs glow too
    const s = this.safeRoom;
    sp.lights.push({ x: s.cx + 0.5, y: s.cy + 0.5, s: 1.3, r: 6, c: [1.0, 0.82, 0.58] });
    sp.lights.push({ x: this.stairs.x, y: this.stairs.y, s: 0.9, r: 4.5, c: [0.4, 0.75, 1.0] });
  }

  computeLight() {
    const { W, H } = this;
    for (const L of this.spawns.lights) {
      const R = L.r || 5, c = L.c || [1, 1, 1];
      for (let y = Math.max(0, (L.y - R) | 0); y <= Math.min(H - 1, (L.y + R) | 0); y++) {
        for (let x = Math.max(0, (L.x - R) | 0); x <= Math.min(W - 1, (L.x + R) | 0); x++) {
          const d = Math.hypot(x + 0.5 - L.x, y + 0.5 - L.y);
          if (d > R) continue;
          const i = this.idx(x, y);
          if (!this.passable(i)) continue;
          if (d > 1 && !this.los(L.x, L.y, x + 0.5, y + 0.5)) continue;
          const f = 1 - d / R, v = L.s * (f * f * 1.1 + f * 0.25);
          this.lr[i] += v * c[0]; this.lg[i] += v * c[1]; this.lb[i] += v * c[2];
        }
      }
    }
    // Each vertex averages the open cells touching it and is darkened by the
    // walls around it: smooth gradients plus ambient occlusion in corners.
    const AO = [1, 0.86, 0.66, 0.5, 0.5];
    this.ao = new Float32Array((W + 1) * (H + 1));
    for (let y = 0; y <= H; y++) for (let x = 0; x <= W; x++) {
      let r = 0, g = 0, b = 0, open = 0, solid = 0;
      for (const [cx, cy] of [[x - 1, y - 1], [x, y - 1], [x - 1, y], [x, y]]) {
        if (!this.inside(cx, cy)) { solid++; continue; }
        const i = cy * W + cx;
        if (!this.passable(i)) { solid++; continue; }
        r += this.lr[i]; g += this.lg[i]; b += this.lb[i]; open++;
      }
      const vi = y * (W + 1) + x, k = open ? AO[solid] / open : 0;
      this.svr[vi] = Math.min(1.6, r * k); this.svg[vi] = Math.min(1.6, g * k); this.svb[vi] = Math.min(1.6, b * k);
      this.ao[vi] = AO[solid];
    }
  }

  // Copy static light, then add this frame's moving lights (explosions, spells).

<script>
'use strict';

// Software raycaster: textured walls with sliding doors, textured floor and

// hand-drawn first-person weapon.

  tex: null, wallTex: [], fog: [0, 0, 0], cam: null,

  aoTab: null, tmp: [0, 0, 0], spanA: new Float32Array(3), spanB: new Float32Array(3),

  resize() {

  setTheme(tex, fog) {

    this.fog = fog;

  },

  // ---------------------------------------------------------------- scene
  frame(G, sprites, dyn) {

  drawSprite(s, ar, ag, ab, fogK, M) {

  // world -> screen, for floating text
  project(x, y, z) {
